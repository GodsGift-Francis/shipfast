# Local Postgres for development.
#   docker compose up -d      # start the database
#   docker compose down       # stop it (data is kept in the named volume)
#   docker compose down -v    # stop and delete all data
#
# Matches the DATABASE_URL in .env.example:
#   postgresql://postgres:shipfast@localhost:5432/shipfast
services:
  db:
    image: postgres:16
    container_name: shipfast-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: shipfast
      POSTGRES_DB: shipfast
    ports:
      - "5432:5432"
    volumes:
      - shipfast-pgdata:/var/lib/postgresql/data
volumes:
  shipfast-pgdata:
