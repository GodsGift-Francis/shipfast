openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: ShipFast Global Shipping API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: shipments
    description: Cargo shipment management
  - name: tracking
    description: Package tracking
  - name: quotes
    description: Shipping quotes
  - name: customers
    description: Customer management
  - name: routes
    description: Available shipping routes
  - name: dashboard
    description: Dashboard analytics
  - name: notifications
    description: User notifications
  - name: invoices
    description: Invoice management

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ── Shipments ──────────────────────────────────────────────────────────────
  /shipments:
    get:
      operationId: listShipments
      tags: [shipments]
      summary: List all shipments
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, processing, in_transit, out_for_delivery, delivered, cancelled, on_hold]
        - name: customerId
          in: query
          schema:
            type: ["integer", "null"]
        - name: search
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: List of shipments
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShipmentList"
    post:
      operationId: createShipment
      tags: [shipments]
      summary: Book a new shipment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShipmentInput"
      responses:
        "201":
          description: Shipment created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Shipment"

  /shipments/{id}:
    get:
      operationId: getShipment
      tags: [shipments]
      summary: Get shipment by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Shipment details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShipmentDetail"
        "404":
          description: Not found
    patch:
      operationId: updateShipment
      tags: [shipments]
      summary: Update a shipment
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShipmentUpdate"
      responses:
        "200":
          description: Updated shipment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Shipment"
    delete:
      operationId: cancelShipment
      tags: [shipments]
      summary: Cancel a shipment
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Cancelled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Shipment"

  # ── Tracking ───────────────────────────────────────────────────────────────
  /track/{trackingNumber}:
    get:
      operationId: trackPackage
      tags: [tracking]
      summary: Public package tracking by tracking number
      parameters:
        - name: trackingNumber
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Tracking result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrackingResult"
        "404":
          description: Not found

  /shipments/{id}/events:
    get:
      operationId: listTrackingEvents
      tags: [tracking]
      summary: Get tracking events for a shipment
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of tracking events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TrackingEvent"
    post:
      operationId: addTrackingEvent
      tags: [tracking]
      summary: Add a tracking event (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TrackingEventInput"
      responses:
        "201":
          description: Event added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrackingEvent"

  # ── Quotes ─────────────────────────────────────────────────────────────────
  /quotes:
    get:
      operationId: listQuotes
      tags: [quotes]
      summary: List all quotes
      responses:
        "200":
          description: List of quotes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Quote"
    post:
      operationId: createQuote
      tags: [quotes]
      summary: Request a shipping quote
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuoteInput"
      responses:
        "201":
          description: Quote generated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Quote"

  /quotes/{id}:
    get:
      operationId: getQuote
      tags: [quotes]
      summary: Get a quote by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Quote details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Quote"

  /quotes/{id}/accept:
    post:
      operationId: acceptQuote
      tags: [quotes]
      summary: Accept a quote and convert to shipment
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Quote accepted, shipment created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Shipment"

  # ── Customers ──────────────────────────────────────────────────────────────
  /customers:
    get:
      operationId: listCustomers
      tags: [customers]
      summary: List all customers
      parameters:
        - name: search
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            default: 1
      responses:
        "200":
          description: List of customers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Customer"
    post:
      operationId: createCustomer
      tags: [customers]
      summary: Create a new customer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomerInput"
      responses:
        "201":
          description: Customer created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Customer"

  /customers/{id}:
    get:
      operationId: getCustomer
      tags: [customers]
      summary: Get customer by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Customer details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Customer"
    patch:
      operationId: updateCustomer
      tags: [customers]
      summary: Update a customer
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomerUpdate"
      responses:
        "200":
          description: Updated customer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Customer"

  # ── Routes ─────────────────────────────────────────────────────────────────
  /routes:
    get:
      operationId: listRoutes
      tags: [routes]
      summary: List available shipping routes
      responses:
        "200":
          description: Available routes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Route"

  # ── Dashboard ──────────────────────────────────────────────────────────────
  /dashboard/stats:
    get:
      operationId: getDashboardStats
      tags: [dashboard]
      summary: Get dashboard summary statistics
      responses:
        "200":
          description: Dashboard stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardStats"

  /dashboard/activity:
    get:
      operationId: getRecentActivity
      tags: [dashboard]
      summary: Get recent shipment activity feed
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
      responses:
        "200":
          description: Recent activity
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ActivityItem"

  /dashboard/shipments-by-status:
    get:
      operationId: getShipmentsByStatus
      tags: [dashboard]
      summary: Get shipment counts grouped by status
      responses:
        "200":
          description: Counts by status
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StatusCount"

  /dashboard/revenue-trend:
    get:
      operationId: getRevenueTrend
      tags: [dashboard]
      summary: Get monthly revenue trend (last 6 months)
      responses:
        "200":
          description: Revenue trend
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RevenueTrendPoint"

  # ── Notifications ──────────────────────────────────────────────────────────
  /notifications:
    get:
      operationId: listNotifications
      tags: [notifications]
      summary: List user notifications
      responses:
        "200":
          description: Notifications
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Notification"

  /notifications/{id}/read:
    patch:
      operationId: markNotificationRead
      tags: [notifications]
      summary: Mark a notification as read
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Notification"

  # ── Invoices ───────────────────────────────────────────────────────────────
  /invoices:
    get:
      operationId: listInvoices
      tags: [invoices]
      summary: List all invoices
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [draft, sent, paid, overdue, cancelled]
        - name: customerId
          in: query
          schema:
            type: ["integer", "null"]
      responses:
        "200":
          description: List of invoices
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Invoice"
    post:
      operationId: createInvoice
      tags: [invoices]
      summary: Create a new invoice
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvoiceInput"
      responses:
        "201":
          description: Invoice created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invoice"

  /invoices/{id}:
    get:
      operationId: getInvoice
      tags: [invoices]
      summary: Get invoice by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Invoice details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invoice"

components:
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string

    # ── Shipment ──────────────────────────────────────────────────────────────
    Shipment:
      type: object
      required: [id, trackingNumber, status, serviceType, originAddress, destinationAddress, senderName, recipientName, estimatedDelivery, createdAt, updatedAt]
      properties:
        id:
          type: integer
        trackingNumber:
          type: string
        status:
          type: string
          enum: [pending, processing, in_transit, out_for_delivery, delivered, cancelled, on_hold]
        serviceType:
          type: string
          enum: [standard, express, overnight, freight, international]
        originAddress:
          type: string
        originCity:
          type: string
        originCountry:
          type: string
        destinationAddress:
          type: string
        destinationCity:
          type: string
        destinationCountry:
          type: string
        senderName:
          type: string
        senderEmail:
          type: string
        senderPhone:
          type: string
        recipientName:
          type: string
        recipientEmail:
          type: string
        recipientPhone:
          type: string
        weight:
          type: number
        dimensions:
          type: ["string", "null"]
        declaredValue:
          type: ["number", "null"]
        shippingCost:
          type: number
        currency:
          type: string
          default: USD
        notes:
          type: ["string", "null"]
        customerId:
          type: ["integer", "null"]
        estimatedDelivery:
          type: string
        actualDelivery:
          type: ["string", "null"]
        createdAt:
          type: string
        updatedAt:
          type: string

    ShipmentDetail:
      allOf:
        - $ref: "#/components/schemas/Shipment"
        - type: object
          properties:
            events:
              type: array
              items:
                $ref: "#/components/schemas/TrackingEvent"
            customer:
              $ref: "#/components/schemas/Customer"

    ShipmentList:
      type: object
      required: [shipments, total, page, limit]
      properties:
        shipments:
          type: array
          items:
            $ref: "#/components/schemas/Shipment"
        total:
          type: integer
        page:
          type: integer
        limit:
          type: integer

    ShipmentInput:
      type: object
      required: [serviceType, originAddress, originCity, originCountry, destinationAddress, destinationCity, destinationCountry, senderName, senderEmail, senderPhone, recipientName, recipientEmail, recipientPhone, weight]
      properties:
        serviceType:
          type: string
          enum: [standard, express, overnight, freight, international]
        originAddress:
          type: string
        originCity:
          type: string
        originCountry:
          type: string
        destinationAddress:
          type: string
        destinationCity:
          type: string
        destinationCountry:
          type: string
        senderName:
          type: string
        senderEmail:
          type: string
        senderPhone:
          type: string
        recipientName:
          type: string
        recipientEmail:
          type: string
        recipientPhone:
          type: string
        weight:
          type: number
        dimensions:
          type: string
        declaredValue:
          type: number
        notes:
          type: string
        customerId:
          type: integer

    ShipmentUpdate:
      type: object
      properties:
        status:
          type: string
          enum: [pending, processing, in_transit, out_for_delivery, delivered, cancelled, on_hold]
        estimatedDelivery:
          type: string
        actualDelivery:
          type: string
        notes:
          type: string

    # ── Tracking ───────────────────────────────────────────────────────────────
    TrackingEvent:
      type: object
      required: [id, shipmentId, status, location, description, timestamp]
      properties:
        id:
          type: integer
        shipmentId:
          type: integer
        status:
          type: string
        location:
          type: string
        description:
          type: string
        timestamp:
          type: string

    TrackingEventInput:
      type: object
      required: [status, location, description]
      properties:
        status:
          type: string
        location:
          type: string
        description:
          type: string
        timestamp:
          type: string

    TrackingResult:
      type: object
      required: [shipment, events]
      properties:
        shipment:
          $ref: "#/components/schemas/Shipment"
        events:
          type: array
          items:
            $ref: "#/components/schemas/TrackingEvent"

    # ── Quote ─────────────────────────────────────────────────────────────────
    Quote:
      type: object
      required: [id, status, serviceType, originCity, originCountry, destinationCity, destinationCountry, weight, estimatedCost, currency, validUntil, createdAt]
      properties:
        id:
          type: integer
        status:
          type: string
          enum: [pending, active, accepted, expired]
        serviceType:
          type: string
          enum: [standard, express, overnight, freight, international]
        originCity:
          type: string
        originCountry:
          type: string
        destinationCity:
          type: string
        destinationCountry:
          type: string
        weight:
          type: number
        dimensions:
          type: ["string", "null"]
        estimatedCost:
          type: number
        currency:
          type: string
        estimatedDays:
          type: integer
        validUntil:
          type: string
        contactName:
          type: string
        contactEmail:
          type: string
        contactPhone:
          type: ["string", "null"]
        notes:
          type: ["string", "null"]
        customerId:
          type: ["integer", "null"]
        createdAt:
          type: string

    QuoteInput:
      type: object
      required: [serviceType, originCity, originCountry, destinationCity, destinationCountry, weight, contactName, contactEmail]
      properties:
        serviceType:
          type: string
          enum: [standard, express, overnight, freight, international]
        originCity:
          type: string
        originCountry:
          type: string
        destinationCity:
          type: string
        destinationCountry:
          type: string
        weight:
          type: number
        dimensions:
          type: string
        declaredValue:
          type: number
        contactName:
          type: string
        contactEmail:
          type: string
        contactPhone:
          type: string
        notes:
          type: string
        customerId:
          type: integer

    # ── Customer ──────────────────────────────────────────────────────────────
    Customer:
      type: object
      required: [id, name, email, createdAt]
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
        phone:
          type: ["string", "null"]
        company:
          type: ["string", "null"]
        address:
          type: ["string", "null"]
        city:
          type: ["string", "null"]
        country:
          type: ["string", "null"]
        tier:
          type: string
          enum: [standard, premium, enterprise]
        totalShipments:
          type: integer
        totalSpend:
          type: number
        createdAt:
          type: string

    CustomerInput:
      type: object
      required: [name, email]
      properties:
        name:
          type: string
        email:
          type: string
        phone:
          type: string
        company:
          type: string
        address:
          type: string
        city:
          type: string
        country:
          type: string
        tier:
          type: string
          enum: [standard, premium, enterprise]

    CustomerUpdate:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
        phone:
          type: string
        company:
          type: string
        address:
          type: string
        city:
          type: string
        country:
          type: string
        tier:
          type: string
          enum: [standard, premium, enterprise]

    # ── Route ─────────────────────────────────────────────────────────────────
    Route:
      type: object
      required: [id, originCity, originCountry, destinationCity, destinationCountry, serviceType, transitDays, basePrice, currency, active]
      properties:
        id:
          type: integer
        originCity:
          type: string
        originCountry:
          type: string
        destinationCity:
          type: string
        destinationCountry:
          type: string
        serviceType:
          type: string
          enum: [standard, express, overnight, freight, international]
        transitDays:
          type: integer
        basePrice:
          type: number
        currency:
          type: string
        active:
          type: boolean

    # ── Dashboard ─────────────────────────────────────────────────────────────
    DashboardStats:
      type: object
      required: [totalShipments, activeShipments, deliveredToday, pendingPickup, totalRevenue, monthlyRevenue, totalCustomers, avgDeliveryTime]
      properties:
        totalShipments:
          type: integer
        activeShipments:
          type: integer
        deliveredToday:
          type: integer
        pendingPickup:
          type: integer
        totalRevenue:
          type: number
        monthlyRevenue:
          type: number
        totalCustomers:
          type: integer
        avgDeliveryTime:
          type: number

    ActivityItem:
      type: object
      required: [id, type, title, description, timestamp, trackingNumber]
      properties:
        id:
          type: integer
        type:
          type: string
          enum: [shipment_created, status_update, delivered, quote_requested, invoice_paid]
        title:
          type: string
        description:
          type: string
        timestamp:
          type: string
        trackingNumber:
          type: string
        status:
          type: ["string", "null"]

    StatusCount:
      type: object
      required: [status, count]
      properties:
        status:
          type: string
        count:
          type: integer

    RevenueTrendPoint:
      type: object
      required: [month, revenue, shipments]
      properties:
        month:
          type: string
        revenue:
          type: number
        shipments:
          type: integer

    # ── Notification ──────────────────────────────────────────────────────────
    Notification:
      type: object
      required: [id, type, title, message, read, createdAt]
      properties:
        id:
          type: integer
        type:
          type: string
          enum: [shipment_update, delivery_alert, quote_expiry, invoice_due, system]
        title:
          type: string
        message:
          type: string
        read:
          type: boolean
        shipmentId:
          type: ["integer", "null"]
        createdAt:
          type: string

    # ── Invoice ───────────────────────────────────────────────────────────────
    Invoice:
      type: object
      required: [id, invoiceNumber, status, customerId, amount, currency, dueDate, createdAt]
      properties:
        id:
          type: integer
        invoiceNumber:
          type: string
        status:
          type: string
          enum: [draft, sent, paid, overdue, cancelled]
        customerId:
          type: integer
        customerName:
          type: string
        amount:
          type: number
        currency:
          type: string
        shipmentIds:
          type: array
          items:
            type: integer
        dueDate:
          type: string
        paidAt:
          type: ["string", "null"]
        notes:
          type: ["string", "null"]
        createdAt:
          type: string

    InvoiceInput:
      type: object
      required: [customerId, amount, dueDate]
      properties:
        customerId:
          type: integer
        amount:
          type: number
        currency:
          type: string
        shipmentIds:
          type: array
          items:
            type: integer
        dueDate:
          type: string
        notes:
          type: string
