kind = "web"
previewPath = "/"
title = "ShipFast - Global Shipping"
version = "1.0.0"
id = "artifacts/shipfast"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 26195

[services.development]
run = "pnpm --filter @workspace/shipfast run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/shipfast", "run", "build" ]
publicDir = "artifacts/shipfast/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "26195"
BASE_PATH = "/"
